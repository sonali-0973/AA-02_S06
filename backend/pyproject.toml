description = "Neutral AA-02 bootstrap with student TODOs"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi", "psycopg[binary]", "uvicorn[standard]"]
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
