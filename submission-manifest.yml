assessment:
  id: "additional-assessment-02"
  title: "Integration, Containerisation, and Testing Readiness Demonstration"
group:
  id: "AA-02"
  members:
    - student_id: "6704864030"
      name: "Zin Nwe Moe"
      contribution_summary: "Responsible for implementing the S06 backend functionality using Python and FastAPI.
       Developed the application service, business logic, and input validation for museum visit plans.
        Implemented REST API endpoints for retrieving exhibits, creating visit plans, adding exhibits, updating allocated visit times, and deleting exhibits.
         Integrated PostgreSQL to persist exhibit data, visit plans, and allocated minutes. Ensured session-based access control, parameterized SQL queries, and correct calculation of total visit duration based on allocated minutes."
    - student_id: "6704864006"
      name: "Thura Hein Thant"
      contribution_summary: "Frontend: exhibit browsing and detail view, stop selection and allocation controls, and a saved-plan display with server-returned totals and validation feedback. Used an AI assistant to help draft and debug the code."
    - student_id: "6704864023"
      name: "Min Khant Zaw"
      contribution_summary: "Database: designed the PostgreSQL schema for exhibits, visit plans and plan items, with primary and foreign keys, a CHECK limiting allocated minutes to 5-60 and an index on plan items. Wrote the seed data for six fictional exhibits, including EXH-001 and EXH-002."
project:
  scenario: "S06 Museum group visit planner"
  frontend_start_command: "docker compose -f config/docker-compose.yml up --build -d"
  backend_start_command: "docker compose -f config/docker-compose.yml up --build -d"
  frontend_url: "http://127.0.0.1:8080"
  backend_base_url: "http://127.0.0.1:8000"
artefacts:
  frontend_root: "frontend"
  backend_root: "backend"
  database_root: "database"
  config_root: "config"
  integration_evidence: "evidence/integration-evidence.md"
  testing_debugging_evidence: "evidence/testing-debugging-evidence.md"
  contribution_evidence: "evidence/contribution-evidence.md"